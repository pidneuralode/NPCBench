[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npcbench-eval"
version = "1.1.0"
description = "Evaluation for NPCBench"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
npcbench = "npcbench_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "LICENSE-DATA.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
